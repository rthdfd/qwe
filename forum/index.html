<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>校友论坛</title>
  <style>
    :root {
      --bg: #f5f6fb;
      --card: #ffffff;
      --primary: #4f46e5;
      --primary-2: #7c6cf0;
      --primary-soft: #eef0ff;
      --text: #1f2430;
      --muted: #8b93a7;
      --border: #eceef3;
      --green: #16b981;
      --radius: 16px;
      --shadow: 0 4px 20px rgba(25, 33, 70, 0.06);
      --maxw: 1200px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 14px; color: var(--text); background: var(--bg); line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    /* 顶栏 */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255,255,255,0.78); backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner { max-width: var(--maxw); margin: 0 auto; padding: 10px 18px; display: flex; align-items: center; gap: 18px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: .5px; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 11px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff; display: grid; place-items: center; font-size: 18px; font-weight: 800;
      box-shadow: 0 6px 16px rgba(79,70,229,.35);
    }
    .search { flex: 1; max-width: 460px; display: flex; background: #f1f2f8; border: 1px solid transparent; border-radius: 12px; padding: 4px 6px 4px 12px; }
    .search input { flex: 1; border: 0; background: transparent; outline: none; font-size: 14px; }
    .search button { border: 0; background: var(--primary); color: #fff; border-radius: 9px; padding: 7px 16px; font-weight: 600; }
    .nav { display: flex; gap: 4px; }
    .nav a { padding: 8px 14px; border-radius: 10px; color: var(--muted); font-weight: 600; }
    .nav a:hover, .nav a.active { color: var(--primary); background: var(--primary-soft); }
    .auth { display: flex; gap: 8px; }
    .btn-ghost { border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 10px; padding: 8px 16px; font-weight: 600; }
    .btn-primary { border: 0; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-radius: 10px; padding: 8px 18px; font-weight: 700; box-shadow: 0 6px 16px rgba(79,70,229,.3); }

    /* 布局 */
    .container { max-width: var(--maxw); margin: 22px auto; padding: 0 18px; display: grid; grid-template-columns: 220px 1fr 310px; gap: 20px; align-items: start; }
    .side { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 16px; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
    .panel-title { font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .5px; margin: 0 0 12px; text-transform: uppercase; }

    /* 圈子导航 */
    .circle { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; transition: .15s; cursor: pointer; }
    .circle:hover { background: var(--primary-soft); }
    .circle .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 18px; background: linear-gradient(135deg,#eef0ff,#e3e9ff); }
    .circle .nm { font-weight: 700; }
    .circle .mt { font-size: 12px; color: var(--muted); }

    /* 信息流 */
    .composer { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    .composer input { flex: 1; border: 0; background: #f1f2f8; border-radius: 12px; padding: 12px 16px; outline: none; font-size: 14px; }
    .post { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; transition: .15s; }
    .post:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(25,33,70,.10); }
    .post-head { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
    .post-head .nm { font-weight: 700; }
    .post-head .mt { font-size: 12px; color: var(--muted); }
    .tag { font-size: 11px; font-weight: 700; color: var(--primary); background: var(--primary-soft); padding: 2px 9px; border-radius: 999px; margin-left: 8px; }
    .post .ttl { font-size: 17px; font-weight: 800; margin: 12px 0 6px; }
    .post .excerpt { color: #454c5e; }
    .post-actions { display: flex; gap: 18px; margin-top: 12px; color: var(--muted); font-size: 13px; font-weight: 600; }
    .post-actions span { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .post-actions span:hover { color: var(--primary); }

    .stats { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .chip { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 14px; box-shadow: var(--shadow); font-size: 13px; color: var(--muted); }
    .chip b { color: var(--text); margin-right: 4px; }

    /* 板块卡片 */
    .board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 14px; }
    .board-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; transition: .15s; cursor: pointer; }
    .board-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(25,33,70,.12); }
    .board-card .ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; background: linear-gradient(135deg,#eef0ff,#e3e9ff); margin-bottom: 12px; }
    .board-card .nm { font-weight: 800; font-size: 16px; }
    .board-card .ds { font-size: 13px; color: var(--muted); margin: 6px 0 12px; }
    .board-card .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }

    /* 右栏 */
    .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag-pill { background: var(--primary-soft); color: var(--primary); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .member { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .member .avatar { width: 36px; height: 36px; font-size: 15px; }
    .mini-list li { padding: 9px 0; border-bottom: 1px dashed var(--border); list-style: none; font-size: 13px; }
    .mini-list { margin: 0; padding: 0; }
    .mini-list li:last-child { border-bottom: 0; }

    /* 帖子详情 */
    .reply { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--border); }
    .reply:last-child { border-bottom: 0; }
    .reply .body { flex: 1; }
    .reply .body .nm { font-weight: 700; }
    .reply .body .tm { font-size: 12px; color: var(--muted); margin-left: 8px; }
    .reply-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-top: 16px; }
    .reply-box textarea { width: 100%; min-height: 90px; border: 1px solid var(--border); border-radius: 12px; padding: 12px; outline: none; resize: vertical; font-family: inherit; background: #fafbff; }
    .reply-box .row { margin-top: 10px; text-align: right; }

    /* 登录弹窗 */
    .modal-mask { position: fixed; inset: 0; background: rgba(20,26,50,.45); backdrop-filter: blur(4px); display: none; place-items: center; z-index: 100; }
    .modal-mask.show { display: grid; }
    .modal { width: 400px; max-width: 92vw; background: #fff; border-radius: 20px; padding: 26px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    .modal h2 { margin: 0 0 16px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .field input { width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 11px; outline: none; background: #fafbff; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tabs button { flex: 1; padding: 10px; border: 1px solid var(--border); background: #f7f8fc; border-radius: 11px; font-weight: 700; }
    .tabs button.active { background: linear-gradient(135deg,var(--primary),var(--primary-2)); color: #fff; border-color: transparent; }

    footer { border-top: 1px solid var(--border); margin-top: 30px; }
    .footer-inner { max-width: var(--maxw); margin: 0 auto; padding: 22px 18px; text-align: center; font-size: 12px; color: var(--muted); }
    .footer-inner a { color: var(--muted); margin: 0 6px; }

    .banner { background: linear-gradient(135deg, var(--primary-soft), #f3effe); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px; font-size: 13px; display: flex; gap: 10px; align-items: center; }
    .banner .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }

    @media (max-width: 980px) {
      .container { grid-template-columns: 1fr; }
      .side { position: static; flex-direction: row; flex-wrap: wrap; }
      .side .panel { flex: 1; min-width: 240px; }
      .nav { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark">校</span><span>校友论坛</span></div>
      <div class="search"><input id="search-input" placeholder="搜索话题、校友、回忆…" /><button id="search-btn">搜索</button></div>
      <nav class="nav">
        <a href="#/" class="active" data-nav>首页</a>
        <a href="#/board/2" data-nav>板块</a>
        <a href="#" data-nav>发现</a>
        <a href="#" data-nav>关于</a>
      </nav>
      <div class="auth">
        <button class="btn-ghost" onclick="location.hash='#/login'">登录</button>
        <button class="btn-primary" onclick="location.hash='#/login'">注册</button>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- 左：圈子导航 -->
    <aside class="side">
      <div class="panel">
        <p class="panel-title">圈子</p>
        <div id="circle-nav"></div>
      </div>
      <div class="panel">
        <p class="panel-title">数据</p>
        <div class="stats" style="margin:0">
          <div class="chip"><b>3</b>今日</div>
          <div class="chip"><b>22</b>帖子</div>
          <div class="chip"><b>9</b>会员</div>
        </div>
      </div>
    </aside>

    <!-- 中：信息流 -->
    <main id="feed"></main>

    <!-- 右：热门/活跃 -->
    <aside class="side">
      <div class="panel">
        <p class="panel-title">热门话题</p>
        <div class="tag-list" id="hot-tags"></div>
      </div>
      <div class="panel">
        <p class="panel-title">活跃校友</p>
        <div id="active-members"></div>
      </div>
      <div class="panel">
        <p class="panel-title">最新回复</p>
        <ul class="mini-list" id="latest-replies"></ul>
      </div>
    </aside>
  </div>

  <footer>
    <div class="footer-inner">
      <a href="#">关于我们</a> | <a href="#">校庆公告</a> | <a href="#/login">登录</a>
      <div style="margin-top:8px">校友论坛 · 学生自发组建的校友交流社区</div>
    </div>
  </footer>

  <!-- 登录/注册弹窗 -->
  <div class="modal-mask" id="modal">
    <div class="modal">
      <div class="tabs"><button id="tab-login" class="active">登录</button><button id="tab-reg">注册</button></div>
      <h2 id="auth-title">登录校友论坛</h2>
      <div class="field"><label>用户名</label><input type="text" placeholder="请输入用户名" /></div>
      <div class="field"><label>密码</label><input type="password" placeholder="请输入密码" /></div>
      <div class="field" id="reg-extra" style="display:none"><label>邮箱</label><input type="text" placeholder="请输入邮箱" /></div>
      <button class="btn-primary" style="width:100%;padding:11px">提交</button>
      <p style="font-size:12px;color:var(--muted);margin-top:12px;text-align:center">壳子演示：外观已完成，暂不接入后端。</p>
      <div style="text-align:center;margin-top:10px"><a href="#" id="close-modal" style="color:var(--muted);font-size:13px">关闭</a></div>
    </div>
  </div>

          { id: 14, title: "推荐文章一篇：母校情深……", author: "校友", time: "3 天前", excerpt: "母校的一草一木都让人怀念。", likes: 12, comments: 3 }

      },
      threadPosts: {
        18: [ { author: "350234", time: "10 分钟前", content: "这是第一帖，欢迎大家来校友交流板块聊聊近况～" } ],
        17: [

    var feed = document.getElementById("feed");
    function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
    function avatar(name){ return '<div class="avatar">' + esc(name.slice(0,1)) + "</div>"; }
    function findBoardName(id){ for(var i=0;i<DATA.groups.length;i++){ var b=DATA.groups[i].boards.find(function(x){return String(x.id)===String(id);}); if(b) return b.name; } return "板块"; }
    function findThread(id){ var all=DATA.threads.concat([].concat.apply([],Object.keys(DATA.boardThreads).map(function(k){return DATA.boardThreads[k];}))); return all.find(function(x){return String(x.id)===String(id);}); }

    function renderSidebars() {
      var circles = "";
      DATA.groups.forEach(function(g){
        g.boards.forEach(function(b){
          circles += '<div class="circle" onclick="location.hash=\'#/board/' + b.id + '\'"><div class="ic">' + b.icon + '</div><div><div class="nm">' + esc(b.name) + '</div><div class="mt">' + b.threads + ' 主题</div></div></div>';
        });
      });
      document.getElementById("circle-nav").innerHTML = circles;

      document.getElementById("hot-tags").innerHTML = DATA.hot.map(function(t){ return '<span class="tag-pill"># ' + esc(t) + "</span>"; }).join("");

      document.getElementById("active-members").innerHTML = DATA.members.map(function(m){
        return '<div class="member">' + avatar(m.name) + '<div><div style="font-weight:700">' + esc(m.name) + '</div><div style="font-size:12px;color:var(--muted)">' + esc(m.role) + "</div></div></div>";
      }).join("");

      document.getElementById("latest-replies").innerHTML = DATA.latestReplies.map(function(t){
        return '<li><a href="#/thread/' + t.id + '">' + esc(t.title) + '</a><div style="color:var(--muted);font-size:12px">' + esc(t.time) + "</div></li>";
      }).join("");
    }

    function postCard(t) {
      return '<div class="post"><div class="post-head">' + avatar(t.author) +
        '<div><div class="nm">' + esc(t.author) + '<span class="tag">' + esc(t.tag || "") + "</span></div>" +
        '<div class="mt">' + esc(t.time) + "</div></div></div>" +
        '<div class="ttl"><a href="#/thread/' + t.id + '">' + esc(t.title) + "</a></div>" +
        '<div class="excerpt">' + esc(t.excerpt || "") + "</div>" +
        '<div class="post-actions"><span>👍 ' + (t.likes||0) + "</span><span>💬 " + (t.comments||0) + "</span><span>↗ 分享</span></div></div>";
    }

    function renderHome() {
      var banner = '<div class="banner"><span class="dot"></span><div>欢迎来到校友论坛 · 缅怀青春，联络同窗，共叙校友情谊 🎓</div></div>';
      var composer = '<div class="composer">' + avatar("我") + '<input placeholder="分享你的近况 / 一段回忆…" /><button class="btn-primary" onclick="alert(\'壳子演示，暂未接入发帖\')">发布</button></div>';
      var posts = DATA.threads.map(postCard).join("");
      feed.innerHTML = banner + composer + posts;
    }

    function renderBoard(id) {
      var boards = DATA.groups.reduce(function(acc,g){ return acc.concat(g.boards); }, []);
      if (id && DATA.boardThreads[id]) {
        var name = findBoardName(id);
        var list = DATA.boardThreads[id].map(postCard).join("");
        feed.innerHTML = '<div class="banner"><span class="dot"></span><div>圈子：<b>' + esc(name) + "</b> · 共 " + DATA.boardThreads[id].length + " 个主题</div></div>" + list;
      } else {
        var cards = boards.map(function(b){
          return '<div class="board-card" onclick="location.hash=\'#/board/' + b.id + '\'">' +
            '<div class="ic">' + b.icon + "</div><div class=\"nm\">" + esc(b.name) + "</div>" +
            '<div class="ds">' + esc(b.desc) + "</div>" +
            '<div class="meta"><span>' + b.threads + " 主题</span><span>最后发表 " + esc(b.last) + "</span></div></div>";
        }).join("");
        feed.innerHTML = '<div class="banner"><span class="dot"></span><div>选择一个圈子开始浏览 🧭</div></div><div class="board-grid">' + cards + "</div>";
      }
    }

    function renderThread(id) {
      var t = findThread(id) || { title: "帖子详情", author: "校友", tag: "", time: "", excerpt: "（示例内容）" };
      var posts = (DATA.threadPosts[id] || [{ author: "校友", time: "刚刚", content: "（示例帖子内容）这是一段示例正文，用于展示帖子详情页的外观。" }]);
      var head = '<div class="post"><div class="post-head">' + avatar(t.author) +
        '<div><div class="nm">' + esc(t.author) + '<span class="tag">' + esc(t.tag || "") + "</span></div><div class=\"mt\">" + esc(t.time) + "</div></div></div>" +
        '<div class="ttl">' + esc(t.title) + "</div><div class=\"excerpt\">" + esc(t.excerpt || "") + "</div></div>";
      var replies = posts.map(function(p){
        return '<div class="reply">' + avatar(p.author) + '<div class="body"><div><span class="nm">' + esc(p.author) + '</span><span class="tm">' + esc(p.time) + "</span></div><div style=\"margin-top:6px\">" + esc(p.content) + "</div></div></div>";
      }).join("");
      feed.innerHTML = head + '<div style="margin:14px 0 6px;font-weight:800">' + posts.length + " 条回复</div>" + replies +
        '<div class="reply-box"><div style="font-weight:800;margin-bottom:10px">发表回复</div><textarea placeholder="写下你的回复…（壳子演示，暂不提交）"></textarea><div class="row"><button class="btn-primary">回复</button></div></div>';
    }

    function router() {
      var hash = location.hash || "#/";
      var parts = hash.replace(/^#\//, "").split("/");
      if (hash === "#/login") { openModal(); return; }
      closeModal();
      if (parts[0] === "" || parts[0] === undefined) return renderHome();
      if (parts[0] === "board") return renderBoard(parts[1]);
      if (parts[0] === "thread") return renderThread(parts[1]);
      return renderHome();
    }

    var modal = document.getElementById("modal");
    function openModal(){ modal.classList.add("show"); }
    function closeModal(){ modal.classList.remove("show"); }
    document.getElementById("close-modal").addEventListener("click", function(e){ e.preventDefault(); closeModal(); });
    modal.addEventListener("click", function(e){ if(e.target === modal) closeModal(); });

    function init() {
      renderSidebars();
      document.getElementById("toggle-narrow"); // noop
      document.getElementById("search-btn").addEventListener("click", function(){
        var q = document.getElementById("search-input").value.trim(); if(q) alert("搜索：" + q + "（壳子演示，未接入搜索）");
      });
      var lb = document.getElementById("tab-login"), rb = document.getElementById("tab-reg");
      var at = document.getElementById("auth-title"), ex = document.getElementById("reg-extra");
      lb.onclick = function(){ lb.classList.add("active"); rb.classList.remove("active"); at.textContent="登录校友论坛"; ex.style.display="none"; };
      rb.onclick = function(){ rb.classList.add("active"); lb.classList.remove("active"); at.textContent="注册校友论坛"; ex.style.display="block"; };
      window.addEventListener("hashchange", router);
      router();
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
  })();
  </script>
</body>
</html>
